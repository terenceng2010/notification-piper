[project]
name = "notification-piper"
version = "0.1.0"
description = "Forward Windows toast notifications to an Android phone via ntfy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "winrt-runtime",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.ApplicationModel",
    "winrt-Windows.UI.Notifications",
    "winrt-Windows.UI.Notifications.Management",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]
